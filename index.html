<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />

        <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
        <link rel="apple-touch-icon" href="/icons/icon.svg" />

        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
        <meta name="description" content="Manage, transpose, and annotate chord sheets in one place. Build setlists in seconds and run your show offline." />
        <meta name="theme-color" content="#feddc2" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="Sheets" />

        <title>Chordo: Free Chord Sheet Manager</title>

        <!-- Open Graph -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Chordo" />
        <meta property="og:title" content="Chordo: Free Chord Sheet Manager" />
        <meta property="og:description" content="Manage, transpose, and annotate chord sheets in one place. Build setlists in seconds and run your show offline." />
        <meta property="og:image" content="https://chordo.org/og-image.jpg" />
        <meta property="og:image:secure_url" content="https://chordo.org/og-image.jpg" />
        <meta property="og:image:type" content="image/jpeg" />
        <meta property="og:image:width" content="1280" />
        <meta property="og:image:height" content="720" />
        <meta property="og:image:alt" content="Chordo: Free Chord Sheet Manager" />

        <!-- Twitter / X Cards -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Chordo: Free Chord Sheet Manager" />
        <meta name="twitter:description" content="Manage, transpose, and annotate chord sheets in one place. Build setlists in seconds and run your show offline." />
        <meta name="twitter:image" content="https://chordo.org/og-image.jpg" />
    </head>
    <body>
        <div id="app"></div>
        <div id="app-fallback" style="display: none; text-align: center; padding: 48px 24px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; color: #3e2723">
            <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 12px">Unable to start Chordo</h2>
            <p style="font-size: 15px; line-height: 1.5; color: #5d4037; max-width: 400px; margin: 0 auto 16px">This browser or OS version is missing required modern web features. Please try updating your system or using an updated browser.</p>
        </div>

        <script>
            window.addEventListener("vite:preloadError", () => window.location.reload())
            window.addEventListener("error", function () {
                var app = document.getElementById("app")
                if (app && !app.hasChildNodes()) {
                    var fallback = document.getElementById("app-fallback")
                    if (fallback) fallback.style.display = "block"
                }
            })
        </script>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
