<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5aa67"/>
      <stop offset="100%" stop-color="#d97828"/>
    </linearGradient>
    <filter id="shadowMask" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#4a2200" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Edge-to-edge solid fill for maskable display -->
  <rect width="512" height="512" fill="url(#bgGradMask)"/>
  
  <!-- Centered safe-zone sheet graphic -->
  <g filter="url(#shadowMask)">
    <rect x="136" y="106" width="240" height="300" rx="16" fill="#ffffff"/>
    
    <!-- Top folded corner -->
    <path d="M326 106 L376 156 L326 156 Z" fill="#fff0e2"/>
    <path d="M326 106 L376 156 L326 156 Z" fill="#000000" fill-opacity="0.08"/>
    
    <!-- Sheet Chord Lines -->
    <rect x="166" y="156" width="130" height="10" rx="5" fill="#f5aa67"/>
    <rect x="166" y="176" width="180" height="6" rx="3" fill="#f7c99e"/>
    
    <!-- Music Note Icon / Symbol in center -->
    <path d="M225 230 L305 210 L305 285 A22 22 0 1 1 283 263 L283 242 L247 251 L247 302 A22 22 0 1 1 225 280 Z" fill="#4a2200"/>
    
    <!-- Lower Chord Lines -->
    <rect x="166" y="340" width="75" height="8" rx="4" fill="#f5aa67"/>
    <rect x="256" y="340" width="85" height="8" rx="4" fill="#f5aa67"/>
    <rect x="166" y="360" width="180" height="6" rx="3" fill="#f7c99e"/>
  </g>
</svg>
